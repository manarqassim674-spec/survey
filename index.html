<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استبيان العناية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', sans-serif;
    background-color: #8db87a; /* pear green ~80% */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }

  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }

  .logo-area {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo-area h1 {
    font-size: 28px;
    font-weight: 800;
    color: #1a3d1f;
    letter-spacing: 1px;
  }

  .logo-area p {
    color: #2d5a32;
    font-size: 14px;
    margin-top: 6px;
  }

  .divider {
    height: 3px;
    background: linear-gradient(to left, transparent, #2d6a35, transparent);
    border-radius: 2px;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    color: #1a3d1f;
    margin-bottom: 7px;
  }

  label span.req { color: #8b0000; margin-right: 2px; }

  input[type="text"],
  input[type="tel"],
  input[type="url"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid #3a7a42;
    border-radius: 10px;
    background: rgba(255,255,255,0.75);
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    color: #1a3d1f;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #1a5c25;
    box-shadow: 0 0 0 3px rgba(45,106,53,0.2);
    background: rgba(255,255,255,0.95);
  }

  textarea {
    resize: vertical;
    min-height: 110px;
  }

  .char-count {
    text-align: left;
    font-size: 12px;
    color: #2d5a32;
    margin-top: 4px;
  }

  .char-count.warn { color: #8b4513; }
  .char-count.ok   { color: #1a5c25; font-weight: 700; }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: #1e5c28;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.25s, transform 0.15s;
    letter-spacing: 0.5px;
  }

  .submit-btn:hover { background: #154a1f; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { background: #6a9e72; cursor: not-allowed; transform: none; }

  .msg {
    display: none;
    text-align: center;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 16px;
  }

  .msg.success { background: rgba(26,92,37,0.2); color: #0d3312; border: 2px solid #1e5c28; }
  .msg.error   { background: rgba(139,0,0,0.12); color: #5a0000; border: 2px solid #8b0000; }

  select option { color: #1a3d1f; background: #fff; }

  .checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(255,255,255,0.75);
    border: 2px solid #3a7a42;
    border-radius: 10px;
    padding: 12px 14px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 400;
    font-size: 14px;
    color: #1a3d1f;
    cursor: pointer;
    padding: 4px 0;
  }

  .check-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #1e5c28;
    cursor: pointer;
    flex-shrink: 0;
  }

  @media(max-width:480px){
    .card { padding: 24px 16px; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-area">
    <h1>🌿 تسجيل مؤثرات وندر</h1>
    <p>يرجى تعبئة جميع الحقول بدقة</p>
  </div>
  <div class="divider"></div>

  <form id="surveyForm">

    <!-- 1. الاسم الثلاثي -->
    <div class="form-group">
      <label>١. الاسم الثلاثي <span class="req">*</span></label>
      <input type="text" id="fullName" placeholder="الاسم الأول، الأب، العائلة" required>
    </div>

    <!-- 2. رقم الهاتف -->
    <div class="form-group">
      <label>٢. رقم الهاتف <span class="req">*</span></label>
      <input type="tel" id="phone" placeholder="07XXXXXXXXX" required>
    </div>

    <!-- 3. المحافظة -->
    <div class="form-group">
      <label>٣. المحافظة <span class="req">*</span></label>
      <select id="governorate" required>
        <option value="">— اختر المحافظة —</option>
        <option>بغداد</option><option>البصرة</option><option>نينوى</option>
        <option>أربيل</option><option>النجف</option><option>كربلاء</option>
        <option>الأنبار</option><option>ديالى</option><option>صلاح الدين</option>
        <option>كركوك</option><option>واسط</option><option>ميسان</option>
        <option>ذي قار</option><option>المثنى</option><option>القادسية</option>
        <option>بابل</option><option>دهوك</option><option>السليمانية</option>
      </select>
    </div>

    <!-- 4. المنطقة -->
    <div class="form-group">
      <label>٤. المنطقة ونقطة دالة <span class="req">*</span></label>
      <input type="text" id="area" placeholder="مثال: الكرادة، قرب مول بغداد" required>
    </div>

    <!-- 5 & 6. روابط السوشيال ميديا -->
    <div class="row2">
      <div class="form-group">
        <label>٥. رابط الانستغرام <span class="req">*</span></label>
        <input type="url" id="instagram" placeholder="https://instagram.com/..." required>
      </div>
      <div class="form-group">
        <label>٦. رابط التيك توك <span class="req">*</span></label>
        <input type="url" id="tiktok" placeholder="https://tiktok.com/..." required>
      </div>
    </div>

    <!-- 7. تاريخ الميلاد -->
    <div class="form-group">
      <label>٧. تاريخ الميلاد <span class="req">*</span></label>
      <input type="date" id="birthdate" required>
    </div>

    <!-- 8. نوع البشرة -->
    <div class="form-group">
      <label>٨. نوع البشرة <span class="req">*</span></label>
      <select id="skinType" required>
        <option value="">— اختر نوع البشرة —</option>
        <option>بشرة دهنية</option>
        <option>بشرة جافة</option>
        <option>بشرة مختلطة</option>
        <option>بشرة عادية</option>
        <option>بشرة حساسة</option>
      </select>
    </div>

    <!-- 8b. مشكلة البشرة -->
    <div class="form-group">
      <label>مشكلة البشرة <span class="req">*</span> <small style="font-weight:400;color:#2d5a32;">(يمكن اختيار أكثر من مشكلة)</small></label>
      <div class="checkbox-group" id="skinProblems">
        <label class="check-item"><input type="checkbox" value="البشرة المعرضة للحبوب"> البشرة المعرضة للحبوب</label>
        <label class="check-item"><input type="checkbox" value="البشرة المتحسسة/الملتهبة"> البشرة المتحسسة / الملتهبة</label>
        <label class="check-item"><input type="checkbox" value="البشرة المتضررة من الحاجز الجلدي"> البشرة المتضررة من الحاجز الجلدي</label>
        <label class="check-item"><input type="checkbox" value="البشرة المعرضة لانسداد المسام"> البشرة المعرضة لانسداد المسام</label>
        <label class="check-item"><input type="checkbox" value="البشرة المصابة بالتصبغات"> البشرة المصابة بالتصبغات</label>
        <label class="check-item"><input type="checkbox" value="البشرة ذات الحاجز الضعيف"> البشرة ذات الحاجز الضعيف</label>
        <label class="check-item"><input type="checkbox" value="البشرة المتعبة بعد الحبوب"> البشرة المتعبة بعد الحبوب</label>
        <label class="check-item"><input type="checkbox" value="البشرة المعرضة للشيخوخة المبكرة"> البشرة المعرضة للشيخوخة المبكرة</label>
        <label class="check-item"><input type="checkbox" value="البشرة المتهيجة بسبب الإفراط بالروتين"> البشرة المتهيجة بسبب الإفراط بالروتين</label>
      </div>
    </div>

    <!-- 9. نوع الشعر -->
    <div class="form-group">
      <label>٩. نوع الشعر <span class="req">*</span> <small style="font-weight:400;color:#2d5a32;">(يمكن اختيار أكثر من نوع)</small></label>
      <div class="checkbox-group" id="hairTypes">
        <label class="check-item"><input type="checkbox" value="الشعر الدهني"> الشعر الدهني</label>
        <label class="check-item"><input type="checkbox" value="الشعر الجاف"> الشعر الجاف</label>
        <label class="check-item"><input type="checkbox" value="الشعر العادي"> الشعر العادي</label>
        <label class="check-item"><input type="checkbox" value="الشعر المختلط"> الشعر المختلط</label>
        <label class="check-item"><input type="checkbox" value="الشعر الكيرلي / المجعد"> الشعر الكيرلي / المجعد</label>
        <label class="check-item"><input type="checkbox" value="الشعر الويفي"> الشعر الويفي</label>
        <label class="check-item"><input type="checkbox" value="الشعر المستقيم"> الشعر المستقيم</label>
      </div>
    </div>

    <!-- 9b. مشكلة الشعر -->
    <div class="form-group">
      <label>مشكلة الشعر <span class="req">*</span> <small style="font-weight:400;color:#2d5a32;">(يمكن اختيار أكثر من مشكلة)</small></label>
      <div class="checkbox-group" id="hairProblems">
        <label class="check-item"><input type="checkbox" value="تساقط الشعر"> تساقط الشعر</label>
        <label class="check-item"><input type="checkbox" value="تقصف الأطراف"> تقصف الأطراف</label>
        <label class="check-item"><input type="checkbox" value="الهيشان / النفشة"> الهيشان / النفشة</label>
        <label class="check-item"><input type="checkbox" value="القشرة"> القشرة</label>
        <label class="check-item"><input type="checkbox" value="جفاف فروة الرأس"> جفاف فروة الرأس</label>
        <label class="check-item"><input type="checkbox" value="زيادة دهون الفروة"> زيادة دهون الفروة</label>
        <label class="check-item"><input type="checkbox" value="ضعف وكسر الشعر"> ضعف وكسر الشعر</label>
        <label class="check-item"><input type="checkbox" value="تلف الشعر بسبب الصبغات أو السحب"> تلف الشعر بسبب الصبغات أو السحب</label>
        <label class="check-item"><input type="checkbox" value="الحساسية بفروة الرأس"> الحساسية بفروة الرأس</label>
        <label class="check-item"><input type="checkbox" value="الشعر المتأثر بالحرارة"> الشعر المتأثر بالحرارة</label>
      </div>
    </div>

    <!-- 10. التخصص الدراسي -->
    <div class="form-group">
      <label>١٠. التخصص الدراسي <span class="req">*</span></label>
      <input type="text" id="study" placeholder="مثال: طب، هندسة، إدارة أعمال..." required>
    </div>

    <!-- 11. ليش تريدين تنضمين لوندر -->
    <div class="form-group">
      <label>١١. ليش تريدين تنضمين لوندر؟ <span class="req">*</span></label>
      <textarea id="whyWonder" placeholder="اكتبي سبب رغبتك بالانضمام..." required></textarea>
    </div>

    <!-- 12. شوكت بلشتي بمجال العناية -->
    <div class="form-group">
      <label>١٢. شوكت بلشتي بمجال العناية؟ <span class="req">*</span></label>
      <input type="text" id="startDate" placeholder="مثال: منذ 2 سنة، منذ 2020..." required>
    </div>

    <!-- 13. الدافع للانضمام -->
    <div class="form-group">
      <label>١٣. شنو هو الدافع أو الحافز اللي يدفعج تنضمين لوندر؟ <span class="req">*</span></label>
      <textarea id="motivation" placeholder="اكتبي دافعك وحافزك..." required></textarea>
    </div>

    <div style="text-align:center; margin-top:18px; padding: 14px; background:rgba(26,92,37,0.15); border-radius:12px; color:#1a3d1f; font-size:14px; line-height:1.8;">
      سيتم معاينة المعلومات المرفوعة والرد عليكم بأقرب وقت ممكن<br>شكراً لكم 🌿
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">📩 إرسال الاستبيان</button>
  </form>

  <div class="msg" id="successMsg">✅ تم إرسال استبيانك بنجاح! شكراً لك 🌿</div>
  <div class="msg" id="errorMsg">❌ حدث خطأ أثناء الإرسال، يرجى المحاولة مجدداً.</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKNh8uO5vBkdRFCYdygxQ5LySTIesXgDtm7Y9xjtIIn-Jsvx9RZa9E_RYV4zfdylqE/exec";

  function countChars(el) {
    const len = el.value.length;
    const cc = document.getElementById('charCount');
    cc.textContent = len + ' / 200 حرف';
    cc.className = 'char-count' + (len >= 200 ? ' ok' : len > 150 ? ' warn' : '');
  }

  document.getElementById('surveyForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإرسال...';

    const payload = {
      fullName:    document.getElementById('fullName').value.trim(),
      phone:       document.getElementById('phone').value.trim(),
      governorate: document.getElementById('governorate').value,
      area:        document.getElementById('area').value.trim(),
      instagram:   document.getElementById('instagram').value.trim(),
      tiktok:      document.getElementById('tiktok').value.trim(),
      birthdate:   document.getElementById('birthdate').value,
      skinType:    document.getElementById('skinType').value,
      skinProblems: [...document.querySelectorAll('#skinProblems input:checked')].map(c=>c.value).join('، '),
      hairType:    [...document.querySelectorAll('#hairTypes input:checked')].map(c=>c.value).join('، '),
      hairProblems:[...document.querySelectorAll('#hairProblems input:checked')].map(c=>c.value).join('، '),
      study:       document.getElementById('study').value.trim(),
      whyWonder:   document.getElementById('whyWonder').value.trim(),
      startDate:   document.getElementById('startDate').value.trim(),
      motivation:  document.getElementById('motivation').value.trim()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('surveyForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (err) {
      document.getElementById('errorMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = '📩 إرسال الاستبيان';
    }
  });
</script>
</body>
</html>
